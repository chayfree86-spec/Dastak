    <div id="app-splash" onclick="window.dismissSplash && window.dismissSplash()">

      <div class="splash-ambient-2"></div>

          <span>Skip</span>

          <svg width="12" height="12" viewBox="0 0 24 24" fill="#FF5200" stroke="#FF5200" stroke-width="1.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
          <span>Live Pickups, Optimized Routes & Real-time Earnings</span>

      <!-- Bottom Progress & Trust -->

        <div class="splash-progress-track">
          <div id="splash-progress" class="splash-progress-fill"></div>
        </div>
        <div class="splash-trust">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FF5200" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"></polygon></svg>

    <script>
      (function() {
        var splash = document.getElementById('app-splash');
        if (window.innerWidth > 768) {
          if (splash && splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
          window.dismissSplash = function() {};
          return;
        }
        var progressEl = document.getElementById('splash-progress');
        var progress = 0;
        var dismissed = false;

        var progressTimer = setInterval(function() {
          if (progress < 100) {
            progress += 6;
            if (progressEl) progressEl.style.width = Math.min(progress, 100) + '%';
          } else {
            clearInterval(progressTimer);
          }
        }, 55);

        window.dismissSplash = function() {
          if (dismissed) return;
          dismissed = true;
          clearInterval(progressTimer);
          if (progressEl) progressEl.style.width = '100%';
          if (splash) {
            splash.classList.add('fade-out');
            setTimeout(function() {
              if (splash && splash.parentNode) {
                splash.parentNode.removeChild(splash);
              }
            }, 420);
          }
        };

        // Safety fallback auto dismiss
        setTimeout(window.dismissSplash, 3000);
      })();
    </script>
